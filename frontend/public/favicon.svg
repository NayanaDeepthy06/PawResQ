<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222A52"/>
      <stop offset="100%" stop-color="#2D3561"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
  </defs>

  <!-- background squircle -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- soft contact shadow -->
  <ellipse cx="256" cy="440" rx="150" ry="22" fill="#000000" opacity="0.22" filter="url(#softShadow)"/>

  <!-- 4 toe pads, fanned -->
  <ellipse cx="104" cy="212" rx="33.6" ry="41.6" fill="#FF8A73" transform="rotate(-22 104 212)"/>
  <ellipse cx="184" cy="140" rx="36" ry="46.4" fill="#FF8A73" transform="rotate(-8 184 140)"/>
  <ellipse cx="328" cy="140" rx="36" ry="46.4" fill="#FF8A73" transform="rotate(8 328 140)"/>
  <ellipse cx="408" cy="212" rx="33.6" ry="41.6" fill="#FF8A73" transform="rotate(22 408 212)"/>

  <!-- heart-shaped main pad -->
  <path d="M256,444 C256,444 136,356 136,268 C136,212 184,188 224,220 C240,236 248,252 256,268 C264,252 272,236 288,220 C328,188 376,212 376,268 C376,356 256,444 256,444 Z" fill="#FF6F59"/>

  <!-- tracking pin with ring -->
  <path d="M408,164 C384,140 376,120 376,100 A32,32 0 1,1 440,100 C440,120 432,140 408,164 Z" fill="#FBF6EF"/>
  <circle cx="408" cy="98" r="11" fill="#2D3561"/>
</svg>
